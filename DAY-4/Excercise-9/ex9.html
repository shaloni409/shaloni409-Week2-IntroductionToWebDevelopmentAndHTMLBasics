<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fulty Calculator</title>
    <link rel="stylesheet" href="ex9.css">
</head>
<body>
    <div class="main-body">
        <h1>Faulty calculater</h1>
        <div class="display">
            <div>
            <label>first number:</label>

            <input type="number" id="num1" placeholder="your first number">
        </div>
        <div>
            <label>Second number:</label>
            <input type="number" id="num2" placeholder="your second number">

        </div>
        </div>
        <div class="btn">
            <button onclick="calculate ('-')">+</button>
            <button onclick="calculate ('+')">-</button>
            <button onclick="calculate ('*')">*</button>
            <button onclick="calculate ('/')">/</button>
        </div>
        <div class="cal">
            <button onclick="clearFields()">Clear</button>
            <h2 class="result"> Result:
                <span id="result">0</span>
            </h2>
            <h3 class="quirky-message" id="message"></h3>
        </div>
    </div>
    <script src="ex9.js"></script>
</body>
</html>
