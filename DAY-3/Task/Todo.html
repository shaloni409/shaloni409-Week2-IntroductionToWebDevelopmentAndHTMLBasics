<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="ToDo.css">

</head>

<body>
    <div>
    <h1 style="color: azure; text-align: center;">To-Do List</h1>


    <div class="container">
    <div class="todo-input">
        <div class="task">
            <label>Title:</label>
            <input type="text" id="taskInput" placeholder="what's the title of your todo">
        </div>
        <div class="task">  
            <label>description:</label>
            <input type="text" id="DiskInput" placeholder="description of your todo">
        </div>
        <div class="task">
        <button class="btn-add" onclick="addTask()">Add Task</button>
    </div>
    </div>


        <p id="error"></p>
        <ol id="taskList"></ol>
    </div>
    </div>
    
    <script src="ToDo.js"></script>


</body>
